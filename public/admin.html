<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Max Style Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;padding:14px;max-width:560px;margin:auto}
h1{font-size:22px;margin-bottom:12px}
.box{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px}
input,select,textarea,button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:16px}
textarea{min-height:90px}
button{background:#111;color:#f3d27a;border:0;font-weight:700;cursor:pointer}
button.sec{background:#eee;color:#111}
button.del{background:#c62828;color:#fff;width:auto;padding:8px 12px;margin:0}
button.edt{background:#c9961a;color:#111;width:auto;padding:8px 12px;margin:0}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item img,.item .np{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.item div{flex:1;font-size:14px}
.msg{font-size:14px;margin-bottom:8px;color:#c62828}
.hint{font-size:12px;color:#666;margin:-6px 0 10px}
#prev{max-height:140px;margin-bottom:10px;border-radius:8px;display:none}
</style>
</head>
<body>
<h1>Max Style Admin</h1>

<div class="box" id="login">
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Log in</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="panel" style="display:none">
  <div class="box">
    <b id="ftitle">Add product</b><br><br>
    <input id="name" placeholder="Product name">
    <input id="price" type="number" inputmode="numeric" placeholder="Price (Rs.)">
    <select id="cat"><option value="women">Women</option><option value="men">Men</option><option value="kids">Kids</option></select>
    <input id="sizes" placeholder="Sizes, comma separated (e.g. S,M,L,XL). Leave empty for no sizes">
    <input id="colors" placeholder="Colors, comma separated. Add #hex for exact color, e.g. Black,Navy:#1f2a44,Beige:#d8c3a5. Leave empty for none">
    <textarea id="desc" placeholder="Description (fabric, care, details)"></textarea>
    <textarea id="chart" placeholder="Size chart. First line = headers, then one row per size. Example:
Size|Chest|Length
S|90|68
M|96|70"></textarea>
    <div class="hint">Size chart: first line headers, then one size per line, columns separated by |</div>
    <input id="file" type="file" accept="image/*">
    <img id="prev" alt="">
    <button id="save">Save product</button>
    <button class="sec" id="cancel" style="display:none">Cancel edit</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="box"><b>Products</b><div id="list"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
let pw=sessionStorage.getItem("pw")||"", image="", editId=null, items=[];
const hdr=()=>({"content-type":"application/json","x-admin-password":pw});

async function shrink(file){
  const img=await createImageBitmap(file);
  const s=Math.min(1,700/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.8);
}
async function login(){
  const r=await fetch("/api/products",{method:"POST",headers:hdr(),body:JSON.stringify({check:true})});
  if(r.ok){sessionStorage.setItem("pw",pw);$("#login").style.display="none";$("#panel").style.display="block";load();}
  else{$("#lmsg").textContent="Wrong password, or the server is not set up yet.";}
}
async function load(){
  items=await (await fetch("/api/products")).json();
  $("#list").innerHTML=items.length?items.map(p=>`<div class="item">
    ${p.has_image?`<img src="/api/image?id=${p.id}&v=${p.updated}" alt="">`:'<div class="np"></div>'}
    <div><b>${p.name}</b><br>Rs. ${p.price.toLocaleString("en-US")} · ${p.cat}</div>
    <button class="edt" onclick="edit(${p.id})">Edit</button>
    <button class="del" onclick="del(${p.id})">Delete</button></div>`).join(""):"<p>No products yet.</p>";
}
function reset(){
  editId=null;image="";
  ["#name","#price","#sizes","#colors","#desc","#chart","#file"].forEach(s=>$(s).value="");
  $("#prev").style.display="none";$("#ftitle").textContent="Add product";$("#cancel").style.display="none";
}
function edit(id){
  const p=items.find(x=>x.id==id);editId=id;image="";
  $("#name").value=p.name;$("#price").value=p.price;$("#cat").value=p.cat;
  $("#sizes").value=p.sizes||"";$("#colors").value=p.colors||"";
  $("#desc").value=p.description||"";$("#chart").value=p.size_chart||"";
  $("#ftitle").textContent="Edit product (leave photo empty to keep it)";$("#cancel").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
async function del(id){
  if(!confirm("Delete this product?"))return;
  await fetch("/api/products?id="+id,{method:"DELETE",headers:hdr()});load();
}
$("#go").onclick=()=>{pw=$("#pw").value;login();};
$("#cancel").onclick=reset;
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  image=await shrink(f);$("#prev").src=image;$("#prev").style.display="block";
};
$("#save").onclick=async()=>{
  const body={id:editId,name:$("#name").value,price:$("#price").value,cat:$("#cat").value,
    sizes:$("#sizes").value,colors:$("#colors").value,description:$("#desc").value,size_chart:$("#chart").value};
  if(image)body.image=image;
  $("#msg").textContent="Saving…";
  const r=await fetch("/api/products",{method:"POST",headers:hdr(),body:JSON.stringify(body)});
  if(r.ok){$("#msg").textContent="";reset();load();}else{$("#msg").textContent=(await r.json()).error||"Error";}
};
if(pw)login();
</script>
</body>
</html>
