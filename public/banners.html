<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Home banners</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;padding:16px;max-width:520px;margin:auto}
h1{font-size:20px;margin-bottom:12px}
.box{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:#555;margin:8px 0 4px}
input,button{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:16px;margin-bottom:6px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
button{background:#111;color:#f3d27a;border:0;font-weight:700;cursor:pointer;margin-top:6px}
button.del{background:#c62828;color:#fff;width:auto;display:inline-block;padding:10px 14px;margin-left:6px}
button.save{width:auto;display:inline-block;padding:10px 14px}
.msg{font-size:14px;min-height:20px;margin-top:6px}
.ok{color:#1a7f37}.err{color:#c62828}
.hint{font-size:12px;color:#666;margin-top:4px}
.thumb{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:8px;background:#eee;display:block;margin-bottom:6px}
</style>
</head>
<body>
<h1>Home banners</h1>

<div class="box" id="login">
  <label>Admin password</label>
  <input id="pw" type="password">
  <button id="go">Continue</button>
  <div class="msg err" id="lmsg"></div>
</div>

<div id="panel" style="display:none">
  <div class="box">
    <b>Add banner</b> <span class="hint" id="count"></span>
    <label>Photo (wide photo is best, e.g. 1600 x 700)</label>
    <input id="file" type="file" accept="image/*">
    <img id="prev" alt="" style="width:100%;display:none;border-radius:8px;margin:6px 0">
    <label>Text on the banner (optional)</label>
    <input id="ntext" maxlength="120" placeholder="e.g. New arrivals this week">
    <label>Link when tapped (optional)</label>
    <input id="nlink" maxlength="300" placeholder="e.g. /?cat=women or https://...">
    <label>Order (0 = first)</label>
    <input id="npos" type="number" value="0">
    <label><input id="nactive" type="checkbox" checked> Show on the website</label>
    <button id="add">Add banner</button>
    <div class="msg" id="amsg"></div>
  </div>
  <div id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let pw = sessionStorage.getItem("pw") || "";
let image = "";
const hdr = () => ({ "content-type": "application/json", "x-admin-password": pw });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Checks the password. An empty request is refused with 400 when the password is right, and 401 when it is wrong.
async function check() {
  const r = await fetch("/api/banners", { method: "POST", headers: hdr(), body: "{}" });
  return r.status !== 401;
}
function show() { $("#login").style.display = "none"; $("#panel").style.display = "block"; load(); }

async function shrink(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1200 / img.width);
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}

async function load() {
  const r = await fetch("/api/banners", { headers: hdr() });
  const list = r.ok ? await r.json() : [];
  $("#count").textContent = list.length + " / 6";
  $("#list").innerHTML = list.map(b => `<div class="box" data-id="${b.id}">
      <img class="thumb" src="${b.image}" alt="">
      <label>Text</label><input class="t" value="${esc(b.text)}" maxlength="120">
      <label>Link</label><input class="l" value="${esc(b.link)}" maxlength="300">
      <label>Order</label><input class="p" type="number" value="${esc(b.pos)}">
      <label><input class="a" type="checkbox" ${b.active ? "checked" : ""}> Show on the website</label>
      <button class="save" data-save="${b.id}">Save</button><button class="del" data-del="${b.id}">Delete</button>
      <div class="msg" data-m="${b.id}"></div>
    </div>`).join("") || '<p class="hint">No banners yet.</p>';
}

async function saveRow(id) {
  const box = document.querySelector(`[data-id="${id}"]`);
  const msg = box.querySelector(`[data-m="${id}"]`);
  const r = await fetch("/api/banners", {
    method: "POST", headers: hdr(),
    body: JSON.stringify({ id: Number(id), text: box.querySelector(".t").value, link: box.querySelector(".l").value,
      pos: box.querySelector(".p").value, active: box.querySelector(".a").checked })
  });
  const d = await r.json().catch(() => ({}));
  msg.className = "msg " + (r.ok ? "ok" : "err");
  msg.textContent = r.ok ? "Saved ✓" : (d.error || "Could not save");
}

async function delRow(id) {
  if (!confirm("Delete this banner?")) return;
  await fetch("/api/banners?id=" + id, { method: "DELETE", headers: hdr() });
  load();
}

$("#list").addEventListener("click", e => {
  if (e.target.dataset.save) saveRow(e.target.dataset.save);
  if (e.target.dataset.del) delRow(e.target.dataset.del);
});

$("#file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  image = await shrink(f);
  $("#prev").src = image; $("#prev").style.display = "block";
};

$("#add").onclick = async () => {
  const msg = $("#amsg");
  msg.className = "msg";
  if (!image) { msg.className = "msg err"; msg.textContent = "Choose a photo first."; return; }
  msg.textContent = "Adding…";
  const r = await fetch("/api/banners", {
    method: "POST", headers: hdr(),
    body: JSON.stringify({ image, text: $("#ntext").value, link: $("#nlink").value, pos: $("#npos").value, active: $("#nactive").checked })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { msg.className = "msg err"; msg.textContent = d.error || "Could not add"; return; }
  image = ""; $("#file").value = ""; $("#prev").style.display = "none";
  $("#ntext").value = ""; $("#nlink").value = ""; $("#npos").value = "0";
  msg.className = "msg ok"; msg.textContent = "Added ✓";
  load();
};

$("#go").onclick = async () => {
  pw = $("#pw").value;
  if (await check()) { sessionStorage.setItem("pw", pw); show(); }
  else $("#lmsg").textContent = "Wrong password.";
};
if (pw) check().then(ok => { if (ok) show(); else sessionStorage.removeItem("pw"); });
</script>
</body>
</html>
