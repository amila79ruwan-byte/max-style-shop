<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Style</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="1042795727_1794864022407312~2.jpg">
</head>
<body>
<div class="promo">Sign up and get 10% off on your first order</div>

<header>
  <button class="ib" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <a class="logo" href="#top"><b>MAX <span>STYLE</span></b></a>
  <div class="hr">
    <button id="langBtn" aria-label="Change language" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-weight:700;font-size:13px;align-self:center">සිං</button>
    <button class="ib" id="cartBtn" aria-label="Open cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg><span class="badge" id="cnt">0</span></button>
    <button class="ib" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </div>
</header>
<div class="sbar" id="sbar"><input id="q" type="search" placeholder="Search products"></div>

<main id="top">
  <div class="banner">
    <img src="1042795727_1794864022407312~2.jpg" alt="Max Style - Style without limits">
  </div>

  <h2 class="title">NEW ARRIVALS</h2>
  <div class="tiles">
    <button class="tile w" data-cat="women"><img src="41779449_1795005921595579.jpg" alt=""><span>Women</span></button>
    <button class="tile m" data-cat="men"><img src="226417524_1795005988881598.jpg" alt=""><span>Men</span></button>
    <button class="tile k" data-cat="kids"><img src="317669206_1795007572070883.jpg" alt=""><span>Kids</span></button>
  </div>

  <h2 class="title" id="shop">OUR COLLECTION</h2>
  <div class="chips" id="chips">
    <button class="on" data-cat="all">All</button><button data-cat="women">Women</button><button data-cat="men">Men</button><button data-cat="kids">Kids</button>
  </div>
  <div class="pgrid" id="grid"></div>
</main>

<footer id="contact">
  <b>Max Style</b><br>Style without limits.<br>Order on WhatsApp for fast delivery.
</footer>

<a class="fab" id="wa" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.3z"/></svg></a>

<nav class="bn">
  <button data-go="top" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
  <button id="wishBtn" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span class="badge" id="wcnt">0</span></button>
  <button id="cartBtn2" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M2 4h3l2.5 11h11L21 7H6M9 20h.01M17 20h.01"/></svg><span class="badge" id="cnt2">0</span></button>
  <button id="accBtn" aria-label="My account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
</nav>

<div class="ov" id="ov"></div>

<aside class="dr" id="menu" aria-label="Menu">
  <div class="dh">Menu <button class="ib" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <button class="mi" data-cat="women">Womens</button>
  <button class="mi" data-cat="men">Mens</button>
  <button class="mi" data-cat="kids">Kids</button>
  <button class="mi" data-cat="all">New Arrivals</button>
  <button class="mi off" data-cat="all">Offers</button>
  <div class="ml"><a href="#contact" data-close>Contact Us</a><a href="#contact" data-close>Delivery and Returns</a><a href="track.html">Track my order</a></div>
</aside>

<aside class="dr" id="cart" aria-label="Cart">
  <div class="dh">Your cart <button class="ib" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <div id="items"></div>
  <div class="co">
    <div class="tot"><span>Total</span><span>Rs. <span id="total">0</span></span></div>
    <input id="name" placeholder="Your name" autocomplete="name">
    <input id="phone" placeholder="Phone number (WhatsApp)" inputmode="tel" autocomplete="tel">
    <input id="phone2" placeholder="Alternate phone number (optional)" inputmode="tel" autocomplete="tel">
    <select id="district" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;font:inherit;font-size:15px"><option value="">Select district</option><option>Colombo</option><option>Gampaha</option><option>Kalutara</option><option>Kandy</option><option>Matale</option><option>Nuwara Eliya</option><option>Galle</option><option>Matara</option><option>Hambantota</option><option>Jaffna</option><option>Kilinochchi</option><option>Mannar</option><option>Vavuniya</option><option>Mullaitivu</option><option>Batticaloa</option><option>Ampara</option><option>Trincomalee</option><option>Kurunegala</option><option>Puttalam</option><option>Anuradhapura</option><option>Polonnaruwa</option><option>Badulla</option><option>Monaragala</option><option>Ratnapura</option><option>Kegalle</option></select>
    <textarea id="addr" rows="3" placeholder="Delivery address"></textarea>
    <div style="margin:6px 0 12px;font-size:15px">
      <b style="display:block;margin-bottom:6px">Payment method</b>
      <label style="display:block;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px"><input type="radio" name="pay" value="cod" checked> Cash on delivery</label>
      <label style="display:block;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;color:#999"><input type="radio" name="pay" value="card" disabled> Card <small>(Coming soon)</small></label>
      <label style="display:block;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;color:#999"><input type="radio" name="pay" value="bank" disabled> Online bank transfer <small>(Coming soon)</small></label>
    </div>
    <button class="cta" id="order">Place order</button>
    <div id="msg" role="status"></div>
    <p style="margin-top:12px;text-align:center"><a href="track.html" style="text-decoration:underline">Track my order</a></p>
  </div>
</aside>

<script src="install.js"></script>
<script src="lang.js"></script>
<script src="shop.js"></script>
<script src="account.js"></script>
</body>
</html>
