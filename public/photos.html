<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Max Style Photos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;padding:14px;max-width:560px;margin:auto}
h1{font-size:22px;margin-bottom:12px}
.box{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px}
input,select,button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:16px}
button{background:#111;color:#f3d27a;border:0;font-weight:700;cursor:pointer}
button.del{background:#c62828;color:#fff;width:auto;padding:6px 10px;margin:0;font-size:13px}
.msg{font-size:14px;margin-bottom:8px;color:#c62828}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#eee;display:block}
.grid button{position:absolute;top:2px;right:2px;padding:2px 6px;font-size:12px;width:auto;margin:0}
.hint{font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<h1>Product photos (max 5)</h1>

<div class="box" id="login">
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Log in</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="panel" style="display:none">
  <div class="box">
    <select id="prod"></select>
    <div class="grid" id="photos"></div>
    <div class="hint" id="count"></div>
    <input id="files" type="file" accept="image/*" multiple>
    <button id="save">Upload selected photos</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pw=sessionStorage.getItem("pw")||"", products=[];
const hdr=()=>({"content-type":"application/json","x-admin-password":pw});

// Fits a photo into an exact 3:4 picture (720 x 960). The whole photo is kept (nothing is cut off); the empty space is
// filled with the photo's own edge colour, so it looks seamless. Transparent areas count as white.
async function shrink(file){
  const W=720,H=960,img=await createImageBitmap(file);
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  const N=24,t=document.createElement("canvas");t.width=N;t.height=N;
  const tx=t.getContext("2d");tx.drawImage(img,0,0,N,N);
  const d=tx.getImageData(0,0,N,N).data;let r=0,g=0,b=0,n=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    if(i>0&&i<N-1&&j>0&&j<N-1)continue;
    const k=(j*N+i)*4,a=d[k+3]/255;
    r+=d[k]*a+255*(1-a);g+=d[k+1]*a+255*(1-a);b+=d[k+2]*a+255*(1-a);n++;
  }
  x.fillStyle="rgb("+Math.round(r/n)+","+Math.round(g/n)+","+Math.round(b/n)+")";x.fillRect(0,0,W,H);
  const s=Math.min(W/img.width,H/img.height),w=Math.round(img.width*s),h=Math.round(img.height*s);
  x.imageSmoothingQuality="high";
  x.drawImage(img,Math.round((W-w)/2),Math.round((H-h)/2),w,h);
  return c.toDataURL("image/jpeg",.82);
}
async function login(){
  const r=await fetch("/api/products",{method:"POST",headers:hdr(),body:JSON.stringify({check:true})});
  if(r.ok){sessionStorage.setItem("pw",pw);$("#login").style.display="none";$("#panel").style.display="block";await loadProducts();}
  else{$("#lmsg").textContent="Wrong password, or the server is not set up yet.";}
}
async function loadProducts(){
  products=await (await fetch("/api/products")).json();
  $("#prod").innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  await loadPhotos();
}
async function loadPhotos(){
  const id=$("#prod").value;
  const list=await (await fetch("/api/photos?product="+id)).json();
  $("#photos").innerHTML=list.map(p=>`<div><img src="${p.url}" alt=""><button class="del" onclick="delPhoto(${p.id})">X</button></div>`).join("");
  $("#count").textContent=list.length+" / 5 photos";
  window._left=5-list.length;
}
async function delPhoto(pid){
  if(!confirm("Delete this photo?"))return;
  await fetch("/api/photos?id="+pid,{method:"DELETE",headers:hdr()});
  await loadPhotos();
}
$("#go").onclick=()=>{pw=$("#pw").value;login();};
$("#prod").onchange=loadPhotos;
$("#save").onclick=async()=>{
  const files=[...$("#files").files];
  if(!files.length){$("#msg").textContent="Choose photos first.";return;}
  if(files.length>window._left){$("#msg").textContent="You can add only "+window._left+" more photo(s).";return;}
  $("#msg").textContent="Uploading…";
  for(const f of files){
    const image=await shrink(f);
    const r=await fetch("/api/photos",{method:"POST",headers:hdr(),body:JSON.stringify({product:$("#prod").value,image})});
    if(!r.ok){$("#msg").textContent=(await r.json()).error||"Error";await loadPhotos();return;}
  }
  $("#files").value="";$("#msg").textContent="";
  await loadPhotos();
};
if(pw)login();
</script>
</body>
</html>
