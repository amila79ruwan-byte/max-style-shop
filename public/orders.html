<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Max Style Orders</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;padding:14px;max-width:640px;margin:auto}
h1{font-size:22px;margin-bottom:12px}
.box{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;font-size:15px;padding:10px;border:1px solid #ccc;border-radius:8px}
input{width:100%;margin-bottom:8px}
button{background:#111;color:#f3d27a;border:0;font-weight:700;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-weight:700;font-size:17px}
.muted{color:#666;font-size:14px}
.items{font-size:14px;margin:8px 0;padding-left:18px}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700}
.msg{color:#c62828;font-size:14px;margin-bottom:8px}
</style>
</head>
<body>
<h1>Orders</h1>
<div class="box" id="login">
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Log in</button>
  <div class="msg" id="lmsg"></div>
</div>
<div id="panel" style="display:none">
  <div class="row" style="margin-bottom:10px"><span class="muted" id="count"></span><button id="reload">Refresh</button></div>
  <div id="list"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES=[["received","Received"],["confirmed","Confirmed"],["packed","Packed"],["out","Out for delivery"],["delivered","Delivered"],["cancelled","Cancelled"]];
let pw=sessionStorage.getItem("pw")||"";
const hdr=()=>({"content-type":"application/json","x-admin-password":pw});
const waNum=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="94"+d.slice(1);return d;};
const money=n=>Number(n).toLocaleString("en-US");
const dt=t=>t?new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Colombo"}):"";

async function login(){
  const r=await fetch("/api/orders",{headers:hdr()});
  if(r.ok){sessionStorage.setItem("pw",pw);$("#login").style.display="none";$("#panel").style.display="block";load();}
  else{$("#lmsg").textContent="Wrong password, or the server is not set up yet.";}
}
// Payment method text for an order card (old orders without a payment value count as cash on delivery)
function payLine(o){
  const p=o.payment||"cod";
  if(p==="cod")return "Cash on delivery";
  return (p==="bank"?"Bank Deposit":"Online Transfer")+(o.pay_title?" · "+o.pay_title:"")+(o.pay_state==="awaiting"?" · Slip pending":"");
}
async function load(){
  const r=await fetch("/api/orders",{headers:hdr()});
  if(!r.ok){$("#list").innerHTML='<p class="msg">Could not load orders.</p>';return;}
  const orders=await r.json();
  $("#count").textContent=orders.length+" orders";
  $("#list").innerHTML=orders.length?orders.map(o=>{
    const label=(STATUSES.find(s=>s[0]===o.status)||[])[1]||o.status;
    const msg="Hi "+o.name+", your Max Style order "+o.code+" is now: "+label+". Thank you!";
    return `<div class="box">
      <div class="row"><span class="code">${esc(o.code)}</span><span class="muted">${esc(dt(o.created))}</span></div>
      <div><b>${esc(o.name)}</b> · ${esc(o.district)}</div>
      <div class="muted">${esc(o.phone1)}${o.phone2?" / "+esc(o.phone2):""}</div>
      <div class="muted">${esc(o.address)}</div>
      <div style="margin:6px 0"><span style="display:inline-block;background:${(o.payment||"cod")==="cod"?"#eee":"#fdf5d8"};border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600">${esc(payLine(o))}</span></div>
      <ul class="items">${o.items.map(i=>`<li>${esc(i.name)}${i.size?" ("+esc(i.size)+")":""}${i.color?" ["+esc(i.color)+"]":""} x${i.qty}</li>`).join("")}</ul>
      <div class="row"><b>Rs. ${money(o.total)}</b>
        <select onchange="setStatus(${o.id},this.value)">${STATUSES.map(([v,l])=>`<option value="${v}" ${o.status===v?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <p style="margin-top:10px"><a class="wa" href="https://wa.me/${waNum(o.phone1)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp customer</a></p>
    </div>`;}).join(""):"<p>No orders yet.</p>";
}
async function setStatus(id,status){
  const r=await fetch("/api/orders",{method:"PUT",headers:hdr(),body:JSON.stringify({id,status})});
  if(!r.ok)alert("Could not update status.");
  load();
}
$("#go").onclick=()=>{pw=$("#pw").value;login();};
$("#reload").onclick=load;
if(pw)login();
</script>
</body>
</html>
