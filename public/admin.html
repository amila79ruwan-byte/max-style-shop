<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Max Style Admin</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;padding:14px;max-width:560px;margin:auto}
h1{font-size:22px;margin-bottom:12px}
.box{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px}
input,select,textarea,button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:16px}
textarea{min-height:90px}
button{background:#111;color:#f3d27a;border:0;font-weight:700;cursor:pointer}
button.sec{background:#eee;color:#111}
button.del{background:#c62828;color:#fff;width:auto;padding:8px 12px;margin:0}
button.edt{background:#c9961a;color:#111;width:auto;padding:8px 12px;margin:0}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item img,.item .np{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.item div{flex:1;font-size:14px}
.pcode{display:inline-block;background:#111;color:#f3d27a;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.icode{display:inline-block;background:#111;color:#f3d27a;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-right:4px}
.msg{font-size:14px;margin-bottom:8px;color:#c62828}
.hint{font-size:12px;color:#666;margin:-6px 0 10px}
#prev{max-height:140px;margin-bottom:10px;border-radius:8px;display:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#eee;display:block}
.grid button{position:absolute;top:2px;right:2px;padding:2px 6px;font-size:12px;width:auto;margin:0;background:#c62828;color:#fff}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#666;font-size:14px}
.dayh{background:#111;color:#f3d27a;border-radius:8px;padding:10px 12px;margin:14px 0 10px;font-size:14px}
.dayh b{display:block;font-size:15px}
.dayh span{color:#fff;font-size:13px}
.ocard{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:10px;font-size:14px}
.ocard .code{font-weight:700;font-size:16px}
.ocard ul{padding-left:18px;margin:6px 0}
.ocard li{margin-bottom:4px}
.ocard select{margin:6px 0 0;padding:8px;font-size:14px}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<h1>Max Style Admin</h1>

<div class="box" id="login">
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Log in</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="panel" style="display:none">

  <div id="home">
    <button id="gProducts" style="padding:18px;font-size:18px;margin-bottom:12px">Products</button>
    <button id="gOrders" style="padding:18px;font-size:18px">Orders</button>
  </div>

  <div id="vProducts" style="display:none">
  <button class="sec" data-back>← Back</button>
  <div class="box">
    <b id="ftitle">Add product</b><br><br>
    <input id="name" placeholder="Product name">
    <input id="price" type="number" inputmode="numeric" placeholder="Price (Rs.)">
    <select id="cat"><option value="women">Women</option><option value="men">Men</option><option value="kids">Kids</option></select>
    <input id="sizes" placeholder="Sizes, comma separated (e.g. S,M,L,XL). Leave empty for no sizes">
    <input id="colors" placeholder="Colors, comma separated. Add #hex for exact color, e.g. Black,Navy:#1f2a44,Beige:#d8c3a5. Leave empty for none">
    <textarea id="desc" placeholder="Description (fabric, care, details)"></textarea>
    <textarea id="chart" placeholder="Size chart. First line = headers, then one row per size. Example:
Size|Chest|Length
S|90|68
M|96|70"></textarea>
    <div class="hint">Size chart: first line headers, then one size per line, columns separated by |</div>
    <input id="file" type="file" accept="image/*">
    <img id="prev" alt="">
    <button id="save">Save product</button>
    <button class="sec" id="cancel" style="display:none">Cancel edit</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="box" id="pbox" style="display:none">
    <b>Photos (max 5)</b><br><br>
    <div class="grid" id="photos"></div>
    <div class="hint" id="pcount"></div>
    <input id="pfiles" type="file" accept="image/*" multiple>
    <button class="sec" id="pup">Upload photos</button>
    <div class="msg" id="pmsg"></div>
  </div>

  <div class="box">
    <b>Products</b>
    <input id="psearch" type="search" placeholder="Search by code (MS-P0007) or name" style="margin-top:10px">
    <div class="muted" id="pcnt" style="margin-bottom:6px"></div>
    <div id="list"></div>
  </div>
  </div>

  <div id="vOrders" style="display:none">
  <button class="sec" data-back>← Back</button>
  <div class="box">
    <div class="orow"><b>Orders</b><button class="sec" id="oreload" style="width:auto;margin:0;padding:8px 12px">Refresh</button></div>
    <div class="muted" id="ocount" style="margin:6px 0 8px"></div>
    <div id="olist"></div>
  </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let pw=sessionStorage.getItem("pw")||"", image="", editId=null, items=[];
const hdr=()=>({"content-type":"application/json","x-admin-password":pw});

// Automatic product code: made from the product id (id 7 -> MS-P0007).
const pcode=id=>"MS-P"+String(id).padStart(4,"0");
// Code for an order line: uses the saved product id if the order has one, otherwise finds the product by name.
function itemCode(i){
  let id=i.id||i.product_id||i.productId;
  if(!id){
    const nm=String(i.name||"").trim().toLowerCase();
    const p=items.find(x=>String(x.name).trim().toLowerCase()===nm);
    if(p)id=p.id;
  }
  return id?pcode(id):"";
}

async function shrink(file){
  const img=await createImageBitmap(file);
  const s=Math.min(1,700/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.8);
}
async function login(){
  const r=await fetch("/api/products",{method:"POST",headers:hdr(),body:JSON.stringify({check:true})});
  if(r.ok){
    sessionStorage.setItem("pw",pw);$("#login").style.display="none";$("#panel").style.display="block";showView("home");
    await load();   // products first, so order lines can show product codes
    loadOrders();
  }
  else{$("#lmsg").textContent="Wrong password, or the server is not set up yet.";}
}
async function load(){
  items=await (await fetch("/api/products")).json();
  renderList();
}
// Product list with search (by code or name).
function renderList(){
  const term=($("#psearch").value||"").trim().toLowerCase();
  const list=items.filter(p=>!term
    ||pcode(p.id).toLowerCase().includes(term)
    ||String(p.id)===term.replace(/^0+/,"")
    ||String(p.name).toLowerCase().includes(term));
  $("#pcnt").textContent=term?(list.length+" of "+items.length+" products"):(items.length+" products");
  $("#list").innerHTML=list.length?list.map(p=>`<div class="item">
    ${p.has_image?`<img src="/api/image?id=${p.id}&v=${p.updated}" alt="">`:'<div class="np"></div>'}
    <div><span class="pcode">${pcode(p.id)}</span><br><b>${esc(p.name)}</b><br>Rs. ${p.price.toLocaleString("en-US")} · ${esc(p.cat)}</div>
    <button class="edt" onclick="edit(${p.id})">Edit</button>
    <button class="del" onclick="del(${p.id})">Delete</button></div>`).join(""):"<p>"+(term?"No products found.":"No products yet.")+"</p>";
}
$("#psearch").addEventListener("input",renderList);
function reset(){
  editId=null;image="";
  ["#name","#price","#sizes","#colors","#desc","#chart","#file"].forEach(s=>$(s).value="");
  $("#prev").style.display="none";$("#ftitle").textContent="Add product";$("#cancel").style.display="none";
  loadPhotos();
}
function edit(id){
  const p=items.find(x=>x.id==id);editId=id;image="";
  $("#name").value=p.name;$("#price").value=p.price;$("#cat").value=p.cat;
  $("#sizes").value=p.sizes||"";$("#colors").value=p.colors||"";
  $("#desc").value=p.description||"";$("#chart").value=p.size_chart||"";
  $("#ftitle").textContent="Edit product "+pcode(id)+" (leave photo empty to keep it)";$("#cancel").style.display="block";
  loadPhotos();
  window.scrollTo({top:0,behavior:"smooth"});
}
async function del(id){
  if(!confirm("Delete product "+pcode(id)+"?"))return;
  await fetch("/api/products?id="+id,{method:"DELETE",headers:hdr()});load();
}

// Photos: only shown while a product is being edited (photos belong to a saved product)
async function loadPhotos(){
  if(!editId){$("#pbox").style.display="none";return;}
  $("#pbox").style.display="block";
  const list=await (await fetch("/api/photos?product="+editId)).json();
  $("#photos").innerHTML=list.map(p=>`<div><img src="${p.url}" alt=""><button onclick="delPhoto(${p.id})">X</button></div>`).join("");
  $("#pcount").textContent=list.length+" / 5 photos";
  window._left=5-list.length;
}
async function delPhoto(pid){
  if(!confirm("Delete this photo?"))return;
  await fetch("/api/photos?id="+pid,{method:"DELETE",headers:hdr()});
  loadPhotos();
}
$("#pup").onclick=async()=>{
  const files=[...$("#pfiles").files];
  if(!files.length){$("#pmsg").textContent="Choose photos first.";return;}
  if(files.length>window._left){$("#pmsg").textContent="You can add only "+window._left+" more photo(s).";return;}
  $("#pmsg").textContent="Uploading…";
  for(const f of files){
    const img=await shrink(f);
    const r=await fetch("/api/photos",{method:"POST",headers:hdr(),body:JSON.stringify({product:editId,image:img})});
    if(!r.ok){$("#pmsg").textContent=(await r.json()).error||"Error";break;}
  }
  $("#pfiles").value="";$("#pmsg").textContent="";
  loadPhotos();
};

// Orders (tracking): list, status change, WhatsApp to customer, bill
let ORD={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES=[["received","Received"],["confirmed","Confirmed"],["packed","Packed"],["out","Out for delivery"],["delivered","Delivered"],["cancelled","Cancelled"]];
const waNum=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="94"+d.slice(1);return d;};
const money=n=>Number(n).toLocaleString("en-US");
const dt=t=>t?new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Colombo"}):"";
// Expected delivery: 5 working days (Mon-Fri) after the order date.
const deliveryText=t=>{const d=new Date(t);let n=0;while(n<5){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++;}return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Colombo"});};

// Days change at 00:00 Sri Lanka time. dayKey = "2026-11-19", dayLabel = "Today · Thu, 19 Nov 2026".
const dayKey=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:"Asia/Colombo"});
const dayLabel=t=>{
  const k=dayKey(t),today=dayKey(Date.now()),yest=dayKey(Date.now()-864e5);
  const txt=new Date(t).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Colombo"});
  return (k===today?"Today · ":k===yest?"Yesterday · ":"")+txt;
};

async function loadOrders(){
  const r=await fetch("/api/orders",{headers:hdr()});
  if(!r.ok){$("#olist").innerHTML='<p class="msg">Could not load orders.</p>';return;}
  const orders=await r.json();
  orders.forEach(o=>ORD[o.id]=o);
  $("#ocount").textContent=orders.length+" orders";

  // Per-day count and money (cancelled orders are not counted in the money).
  const days={};
  orders.forEach(o=>{
    const k=dayKey(o.created);
    const d=days[k]||(days[k]={n:0,sum:0});
    d.n++;if(o.status!=="cancelled")d.sum+=Number(o.total)||0;
  });

  let lastDay="";
  $("#olist").innerHTML=orders.length?orders.map(o=>{
    const label=(STATUSES.find(s=>s[0]===o.status)||[])[1]||o.status;
    const msg="Hi "+o.name+", your Max Style order "+o.code+" is now: "+label+". Thank you!";
    const k=dayKey(o.created);
    let head="";
    if(k!==lastDay){
      lastDay=k;
      head=`<div class="dayh"><b>${esc(dayLabel(o.created))}</b><span>Orders ${days[k].n} · Rs. ${money(days[k].sum)}</span></div>`;
    }
    return head+`<div class="ocard">
      <div class="orow"><span class="code">${esc(o.code)}</span><span class="muted">${esc(dt(o.created))}</span></div>
      <div class="muted">Delivery within 5 working days, by ${esc(deliveryText(o.created))}</div>
      <div><b>${esc(o.name)}</b> · ${esc(o.district)}</div>
      <div class="muted">${esc(o.phone1)}${o.phone2?" / "+esc(o.phone2):""}</div>
      <div class="muted">${esc(o.address)}</div>
      <ul>${o.items.map(i=>{const c=itemCode(i);return `<li>${c?'<span class="icode">'+c+'</span>':''}${esc(i.name)}${i.size?" ("+esc(i.size)+")":""}${i.color?" ["+esc(i.color)+"]":""} x${i.qty}</li>`;}).join("")}</ul>
      <div class="orow"><b>Rs. ${money(o.total)}</b>
        <select onchange="setOrderStatus(${o.id},this.value)">${STATUSES.map(([v,l])=>`<option value="${v}" ${o.status===v?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <a class="wa" href="https://wa.me/${waNum(o.phone1)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp customer</a>
      <button class="sec" style="margin-top:8px" onclick="printBill(${o.id})">Bill / Print</button>
    </div>`;}).join(""):"<p>No orders yet.</p>";
}
async function setOrderStatus(id,status){
  const r=await fetch("/api/orders",{method:"PUT",headers:hdr(),body:JSON.stringify({id,status})});
  if(!r.ok)alert("Could not update status.");
  loadOrders();
}
$("#oreload").onclick=async()=>{await load();loadOrders();};

// Customer bill for one order (opens in a new tab, then Print)
function printBill(id){
  const o=ORD[id];if(!o)return;
  const rows=o.items.map(i=>`<tr><td>${esc(i.name)}${i.size?" ("+esc(i.size)+")":""}${i.color?"<br><small>"+esc(i.color)+"</small>":""}</td><td>${i.qty}</td><td style="text-align:right">${i.price?"Rs. "+money(i.price*i.qty):""}</td></tr>`).join("");
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill ${esc(o.code)}</title><style>body{font-family:system-ui,sans-serif;max-width:420px;margin:auto;padding:20px;color:#111}h1{font-size:20px;margin:0}.sub{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}td,th{padding:6px 0;border-bottom:1px solid #eee;text-align:left}.tot{font-size:18px;font-weight:700;text-align:right;margin-top:10px}.btn{margin-top:20px;padding:12px;width:100%;background:#111;color:#f3d27a;border:0;border-radius:8px;font-weight:700;font-size:16px}@media print{.btn{display:none}}</style></head><body>
<h1>Max Style</h1><div class="sub">Style without limits · 0722555929</div>
<p style="margin-top:14px"><b>Bill: ${esc(o.code)}</b><br><span class="sub">${esc(dt(o.created))}</span><br><span class="sub">Delivery within 5 working days, by ${esc(deliveryText(o.created))}</span></p>
<p><b>${esc(o.name)}</b><br><span class="sub">${esc(o.phone1)}${o.phone2?" / "+esc(o.phone2):""}<br>${esc(o.address)}<br>${esc(o.district)}</span></p>
<table><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th></tr>${rows}</table>
<div class="tot">Total: Rs. ${money(o.total)}</div>
<p class="sub" style="margin-top:14px">Thank you for shopping with us!</p>
<button class="btn" onclick="window.print()">Print</button>
</body></html>`;
  const w=window.open("","_blank");
  if(!w){alert("Pop-up blocked. Allow pop-ups to print the bill.");return;}
  w.document.write(html);w.document.close();
}

// Home screen with two buttons: Products / Orders
// The phone back button goes back to the home screen (instead of leaving the page).
function showView(v,fromHistory){
  $("#home").style.display=v==="home"?"block":"none";
  $("#vProducts").style.display=v==="products"?"block":"none";
  $("#vOrders").style.display=v==="orders"?"block":"none";
  window.scrollTo(0,0);
  if(fromHistory)return;
  if(v==="home"){ if(history.state&&history.state.av)history.back(); }
  else if(!(history.state&&history.state.av===v))history.pushState({av:v},"");
}
window.addEventListener("popstate",e=>showView((e.state&&e.state.av)||"home",true));
$("#gProducts").onclick=()=>showView("products");
$("#gOrders").onclick=()=>showView("orders");
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>showView("home"));

$("#go").onclick=()=>{pw=$("#pw").value;login();};
$("#cancel").onclick=reset;
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  image=await shrink(f);$("#prev").src=image;$("#prev").style.display="block";
};
$("#save").onclick=async()=>{
  const body={id:editId,name:$("#name").value,price:$("#price").value,cat:$("#cat").value,
    sizes:$("#sizes").value,colors:$("#colors").value,description:$("#desc").value,size_chart:$("#chart").value};
  if(image)body.image=image;
  $("#msg").textContent="Saving…";
  const r=await fetch("/api/products",{method:"POST",headers:hdr(),body:JSON.stringify(body)});
  if(r.ok){$("#msg").textContent="";reset();load();}else{$("#msg").textContent=(await r.json()).error||"Error";}
};
if(pw)login();
// Lets the admin page be installed as an app on the phone
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
