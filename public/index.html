<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Style</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--gold:#c9961a;--gold-d:#9c7210;--red:#e8192c;--soft:#f5f7fa;--line:#e4e6ea;--mute:#666}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Source Sans 3','Noto Sans Sinhala',sans-serif;color:var(--ink);background:#fff;padding-bottom:64px;overflow-x:hidden}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.promo{background:#111;color:#f3d27a;text-align:center;font-size:14px;font-weight:600;padding:8px 10px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:48px 1fr auto;align-items:center;padding:6px 10px;gap:6px}
.ib{background:none;border:0;width:40px;height:40px;display:grid;place-items:center;position:relative}
.ib svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{display:flex;justify-content:center;align-items:center;height:48px}
.logo b{font-size:24px;letter-spacing:1px;font-weight:700}
.logo b span{color:var(--gold)}
.hr{display:flex;gap:2px}
.badge{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#111;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sbar{display:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.sbar.on{display:block}
.sbar input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px}
.banner{background:#000;color:#fff;padding:20px 16px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.banner img{width:min(78%,300px);height:auto;border-radius:12px}
.banner p{font-size:15px;opacity:.9}
.cta{background:var(--gold);color:#111;font-weight:700;border:0;padding:10px 24px;border-radius:6px;font-size:15px}
.title{text-align:center;font-size:26px;font-weight:700;margin:26px 0 14px;display:flex;justify-content:center;align-items:center;gap:10px}
.title::before{content:"";width:4px;height:26px;background:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.tile{position:relative;aspect-ratio:7/8;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:22px;font-weight:700;padding-bottom:20px;border:0;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.tile span{position:relative}
.tile.w{background:#a9c5d3}.tile.m{background:#e3bccb}
.tile.k{grid-column:1/3;aspect-ratio:5/2;background:#e8d98f;align-items:center;padding:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 10px}
.card{border:1px solid var(--line);position:relative;display:flex;flex-direction:column;background:#fff}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,#f1ede2,#e2dccb);display:grid;place-items:center;font-size:44px;font-weight:700;color:var(--gold);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.new{position:absolute;top:0;left:0;z-index:2;background:#1a237e;color:#fff;font-size:11px;font-weight:700;padding:8px 5px;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.heart svg{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:2}
.heart.on svg{fill:var(--red)}
.info{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.info h3{font-size:15px;font-weight:600}
.price{font-weight:700;color:var(--gold-d)}
.add{margin-top:8px;background:#111;color:#fff;border:0;padding:10px;font-weight:600;border-radius:4px}
.empty{grid-column:1/3;text-align:center;color:var(--mute);padding:30px 0}
.chips{display:flex;gap:8px;padding:0 14px;overflow-x:auto}
.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:20px;font-size:14px}
.chips button.on{background:#111;color:#fff;border-color:#111}
footer{background:var(--soft);margin-top:26px;padding:22px 16px;font-size:14px;color:var(--mute);text-align:center}
